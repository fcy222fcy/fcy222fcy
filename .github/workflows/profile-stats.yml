name: Update Profile Stats

on:
  # 允许你手动执行
  workflow_dispatch:

  # 每天自动更新一次
  schedule:
    - cron: "17 2 * * *"

  # 第一次创建/修改 workflow 后自动运行
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p profile

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            "https://github-readme-stats.vercel.app/api?username=fcy222fcy&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true&count_private=false&cache_seconds=86400" \
            -o profile/stats.svg

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=fcy222fcy&layout=compact&theme=github_dark&hide_border=true&langs_count=8&cache_seconds=86400" \
            -o profile/top-langs.svg

          grep -q "<svg" profile/stats.svg
          grep -q "<svg" profile/top-langs.svg

      - name: Commit Generated Stats
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update profile stats"
          git push
